[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst-agent"
version = "0.1.0"
description = "LLM tool-calling agent that turns business questions into SQL and Python workflows"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
analyst-agent = "analyst_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
